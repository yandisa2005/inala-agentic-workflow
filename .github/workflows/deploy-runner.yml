name: Deploy Box ADK Agent to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: inala-development-project
  REGION: us-central1
  SERVICE_NAME: box-adk-extractor-service
  APP_NAME: extractor_agent
  WIF_PROVIDER: projects/373951769736/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: gh-actions-deployer@inala-development-project.iam.gserviceaccount.com

jobs:
  deploy-adk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google ADK CLI
        run: pip install --upgrade google-adk

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ADK Agent to Cloud Run
        run: |
          adk deploy cloud_run \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --service_name="${{ env.SERVICE_NAME }}" \
            --app_name="${{ env.APP_NAME }}" \
            --with_ui \
            ./src/extractor_agent \
            -- \
            --service-account="box-mcp-runner-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --no-cpu-throttling \
            --memory=2Gi \
            --timeout=3600s \
            --allow-unauthenticated \
            --update-env-vars="GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_LOCATION=global,MODEL_NAME=gemini-2.5-flash,MCP_SERVER_SSE_URL=https://box-mcp-server-373951769736.us-central1.run.app/sse" \
            --set-secrets="BOX_DEVELOPER_TOKEN=BOX_DEVELOPER_TOKEN:latest"